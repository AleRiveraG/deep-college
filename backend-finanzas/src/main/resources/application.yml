server:
  port: ${SERVER_PORT:8082}
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/deepcollege}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true   # crea el schema "finanzas" si no existe
        format_sql: true
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
app:
  jwt:
    secret: ${JWT_SECRET:}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
finanzas:
  parametros:
    valor-hora-basica: ${VALOR_HORA_BASICA:19992}
    valor-hora-media: ${VALOR_HORA_MEDIA:21034}
    bono-por-anio: ${BONO_POR_ANIO:0.015}
    tasa-afp: ${TASA_AFP:0.10}
    tasa-salud: ${TASA_SALUD:0.07}
