<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Iniciar Sesión</title>
        <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="estilos.css" rel="stylesheet">
        <link href="images/logo-deep-white.png" rel="icon">
    </head>
    <body>
        <!-- Fondo -->
        <div>

        </div>
        <!-- Login flotante-->
        <div class="row vh-100">
            <div class="col-6">
                <img src="images/images.png" class="img-fluid">
            </div>
            <div class="col-6 bg-info">
                <div class="">
                    <div class=""> 
                        <img src="images/logo deep.png" class="logo">
                    </div>
                    <h1>Iniciar Sesión</h1>
                    <form>
                        <div>
                            <label for="correo">Correo Electrónico</label>
                            <input id="correo" type="email" placeholder="Ingrese su correo electrónico">
                        </div>
                        <div>
                            <label for="contrasena">Contraseña</label>
                            <input id="contrasena" type="password" placeholder="Contraseña">
                        </div>
                        <div>
                            <input id="recuerdame" type="checkbox">
                            <label for="recuerdame">Recuérdame</label>   
                            <a href="#">¿Olvidó su contraseña?</a>
                        </div>
                        <div>
                            <button id="btn-iniciar" type="submit">Iniciar Sesión</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
        <script src="scripts/login.js"></script>
    </body>
</html>
