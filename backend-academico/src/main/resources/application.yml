server:
  port: ${SERVER_PORT:8081}
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/deepcollege}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true   # crea el schema "academico" si no existe
        format_sql: true
        jdbc:
          time_zone: UTC
app:
  jwt:
    secret: ${JWT_SECRET:}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  usuarios:
    base-url: ${USUARIOS_URL:http://localhost:8080}
