<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Mi perfil</title>
        <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="estilos.css" rel="stylesheet">
        <link href="images/logo-deep-white.png" rel="icon">
    </head>
    <body>
        <header>
            <div class="d-flex justify-content-between align-items-center py-3 px-4">
                <div class="d-flex align-items-center">
                    <img src="images/logo-deep-white.png" height="50" class="me-3" alt="Logo Colegio">
                    <span class="badge rol-docente fs-6 ms-2">Estudiante</span>
                </div>
                <a href="index.html">
                    <button id="btn-cerrar" class="btn btn-sm">Cerrar sesión</button>
                </a>
            </div>
        </header>
        <main>
            <div class="container-fluid p-0">
                <div class="row m-0">
                    <!-- Barra de navegación lateral -->
                    <aside class="col-md-2 sidebar min-vh-100">
                        <nav class="list-group">
                            <a href="estudiante-pagina-principal.html" class="list-group-item d-flex align-items-center py-3">
                                <i class="bx bx-home fs-4 me-2 icono-inicio"></i>
                                Inicio
                            </a>
                            <a href="estudiante-mi-perfil.html" class="list-group-item d-flex align-items-center py-3 active" style="background-color: #283A94; border-color: #283A94;">
                                <i class="bx bx-user-id-card fs-4 me-2 icono-perfil"></i>
                                Mi perfil
                            </a>
                            <a href="estudiante-asistencia.html" class="list-group-item d-flex align-items-center py-3">
                                <i class="bx bx-clipboard-check fs-4 me-2 icono-asistencia"></i>
                                Asistencia
                            </a>
                            <a href="estudiante-notas.html" class="list-group-item d-flex align-items-center py-3">
                                <i class="bx bx-education fs-4 me-2 icono-notas"></i>
                                Notas
                            </a>
                            <a href="estudiante-horario.html" class="list-group-item d-flex align-items-center py-3">
                                <i class="bx bx-calendar-alt fs-4 me-2 icono-horarios"></i>
                                Horario
                            </a>
                        </nav>
                    </aside>
                    <section class="col-md-10 py-4 px-4 seccion-perfil">
                        <h1 class="titulo-principal mb-4">Mi perfil</h1>
                        
                        <div class="border rounded p-4 caja-valor bg-light">
                            <form>
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="primer-nombre" class="form-label etiqueta-input fw-bold small">Primer Nombre *</label>
                                        <input id="primer-nombre" class="form-control form-control-sm campo-formulario" value="Alberto">
                                    </div>
                                    <div class="col-md-6 mt-3 mt-md-0">
                                        <label for="segundo-nombre" class="form-label etiqueta-input fw-bold small">Segundo Nombre *</label>
                                        <input id="segundo-nombre" class="form-control form-control-sm campo-formulario" value="Khan">
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="primer-apellido" class="form-label etiqueta-input fw-bold small">Primer Apellido *</label>
                                        <input id="primer-apellido" class="form-control form-control-sm campo-formulario" value="Zhaito">
                                    </div>
                                    <div class="col-md-6 mt-3 mt-md-0">
                                        <label for="segundo-apellido" class="form-label etiqueta-input fw-bold small">Segundo Apellido *</label>
                                        <input id="segundo-apellido" class="form-control form-control-sm campo-formulario" value="Gonzalez">
                                    </div>
                                </div>
                                <div class="row mb-4">
                                    <div class="col-md-6">
                                        <label for="rut" class="form-label etiqueta-input fw-bold small">Rut *</label>
                                        <input id="rut" class="form-control form-control-sm campo-formulario" value="12345678-9">
                                    </div>
                                    <div class="col-md-6 mt-3 mt-md-0">
                                        <label for="fecha-nacimiento" class="form-label etiqueta-input fw-bold small">Fecha de Nacimiento *</label>
                                        <input id="fecha-nacimiento" type="date" class="form-control form-control-sm campo-formulario" value="2026-09-02">
                                    </div>
                                </div>
                                <div class="text-end">
                                    <button id="btn-modificar" type="submit" class="btn btn-sm boton-calcular px-4">Modificar</button>
                                </div>
                            </form>
                        </div>
                    </section>
                </div>
            </div>
        </main>
        <footer>
            <div class="container-fluid contenedor-pie py-4">
                <div class="row py-4 fila-pie">
                    <div class="col-md-6 informacion-colegio px-5 mb-4 mb-md-0">
                        <img src="images/logo-deep-white.png" class="logo img-fluid mb-3" alt="Logo Colegio">
                        <p class="lema-colegio">Formando líderes desde 2026. Educación de calidad y excelencia académica</p>
                        <hr>
                        <div class="d-flex mt-3">
                            <a href="#" class="me-3">
                                <img class="logos-enlaces img-fluid" src="images/Instagram_Glyph_White.png" alt="Logotipo Instagram">
                            </a>
                            <a href="#" class="me-3">
                                <img class="logos-enlaces img-fluid" src="images/Facebook_Logo_Secondary.png" alt="Logotipo Facebook">
                            </a>
                            <a href="#" class="me-3">
                                <img class="logos-enlaces img-fluid" src="images/logo-white.png" alt="Logotipo X">
                            </a>
                            <a href="#" class="me-3">
                                <img class="logos-enlaces img-fluid" src="images/InBug-White.png" alt="Logotipo LinkedIn">
                            </a>
                        </div>
                    </div>
                    <div class="col-md-6 informacion-contacto px-5">
                        <ul class="list-unstyled lista-contacto">
                            <li class="item-contacto mb-4">
                                <span class="titulo-contacto fs-5 fw-bold">Contacto</span>
                            </li>
                            <li class="item-contacto mb-2 d-flex align-items-center">
                                <i class="bx bx-location icono-ubicacion fs-5 me-2"></i>
                                Av. Ubicación 123
                            </li>
                            <li class="item-contacto mb-2 d-flex align-items-center">
                                <i class="bx bx-phone icono-telefono fs-5 me-2"></i>
                                +56 9 9876 5432
                            </li>
                            <li class="item-contacto d-flex align-items-center">
                                <i class="bx bx-envelope icono-correo fs-5 me-2"></i>
                                correo.ejemplo@colegio.cl
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </footer>
        <script src="scripts/estudiante-mi-perfil.js"></script>
    </body>
</html>
