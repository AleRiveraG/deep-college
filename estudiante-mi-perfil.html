<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Mi perfil</title>
        <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <div>
                <img src="images\logo deep.png">
                <span>Docente</span>
                <button>Cerrar Sesión</button>
            </div>
        </header>
        <main>
            <!-- Barra de navegación lateral -->
            <aside>
                <nav>
                    <a href="estudiante-pagina-principal.html">
                        <i class="bx bx-home"></i>
                        Inicio
                    </a>
                    <a href="estudiante-mi-perfil.html">
                        <i class="bx bx-user-id-card"></i>
                        Mi perfil
                    </a>
                    <a href="estudiante-asistencia.html">
                        <i class="bx bx-clipboard-check"></i>
                        Asistencia
                    </a>
                    <a href="estudiante-notas.html">
                        <i class="bx bx-education"></i>
                        Notas
                    </a>
                    <a href="estudiante-horario.html">
                        <i class="bx bx-calendar-alt"></i>
                        Horario
                    </a>
                </nav>
            </aside>
            <section>
                <h1>Mi perfil</h1>
                <div>
                    <form>
                        <div>
                            <label for="primer-nombre">Primer Nombre *</label>
                            <input id="primer-nombre">
                            <label for="segundo-nombre">Segundo Nombre *</label>
                            <input id="segundo-nombre">
                        </div>
                        <div>
                            <label for="primer-apellido">Primer Apellido *</label>
                            <input id="primer-apellido">
                            <label for="segundo-apellido">Segundo Apellido *</label>
                            <input id="segundo-apellido">
                        </div>
                        <div>
                            <label for="rut">Rut *</label>
                            <input id="rut">
                            <label for="fecha-nacimiento">Fecha de Nacimiento *</label>
                            <input id="fecha-nacimiento" type="date">
                        </div>
                        <div>
                            <button type="submit">Modificar</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
        <footer>
            <div class="container-fluid contenedor-pie py-4">
                <div class="row py-4 fila-pie">
                    <div class="col-md-6 informacion-colegio px-5">
                        <img src="images/logo-deep-white.png" class="logo img-fluid">
                        <p class="lema-colegio">Formando líderes desde 2026. Educación de calidad y excelencia académica</p>
                        <hr>
                        <div class="">
                            <a href="#" class="mx-2">
                                <img class="logos-enlaces img-fluid" src="images/Instagram_Glyph_White.png" alt="Logotipo Instagram">
                            </a>
                            <a href="#" class="mx-2">
                                <img class="logos-enlaces img-fluid" src="images/Facebook_Logo_Secondary.png" alt="Logotipo Facebook">
                            </a>
                            <a href="#" class="mx-2">
                                <img class="logos-enlaces img-fluid" src="images/logo-white.png" alt="Logotipo X">
                            </a>
                            <a href="#" class="mx-2">
                                <img class="logos-enlaces img-fluid" src="images/InBug-White.png" alt="Logotipo LinkedIn">
                            </a>
                        </div>
                    </div>
                    <div class="col-md-6 informacion-contacto px-5">
                        <ul class="list-unstyled lista-contacto">
                            <li class="item-contacto mb-4">
                                <span class="titulo-contacto fs-5 fw-bold">Contacto</span>
                            </li>
                            <li class="item-contacto mb-2">
                                <i class="bx bx-location icono-ubicacion me-1"></i>
                                Av. Ubicación 123
                            </li>
                            <li class="item-contacto mb-2">
                                <i class="bx bx-phone icono-telefono me-1"></i>
                                +56 9 9876 5432
                            </li>
                            <li class="item-contacto">
                                <i class="bx bx-envelope icono-correo me-1"></i>
                                correo.ejemplo@colegio.cl
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </footer>
    </body>
</html>
