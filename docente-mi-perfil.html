<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Mi Perfil</title>
        <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="estilos.css" rel="stylesheet">
        <link rel="icon" href="images/logo-deep-white.png">
    </head>
    <body>
        <header>
            <div class="d-flex justify-content-between align-items-center py-3 px-4">
                <div class="d-flex align-items-center">
                    <img src="images/logo-deep-white.png" height="50" class="me-3" alt="Logo Colegio">
                    <span class="badge rol-docente fs-6">Docente</span>
                </div>
                <a href="index.html">
                    <button id="btn-cerrar" class="btn btn-sm">Cerrar Sesión</button>
                </a>
            </div>
        </header>
        <main>
            <div class="container-fluid p-0">
                <div class="row m-0">
                    <aside class="col-md-2 sidebar min-vh-100">
                        <nav class="list-group">
                            <a href="docente-pagina-principal.html" class="list-group-item d-flex align-items-center py-3">
                                <i class="bx bx-home fs-4 me-2 icono-inicio"></i>
                                Inicio
                            </a>
                            <a href="docente-mi-perfil.html" class="list-group-item d-flex align-items-center py-3">
                                <i class="bx bx-user-id-card fs-4 me-2 icono-perfil"></i>
                                Mi perfil
                            </a>
                            <a href="docente-ver-perfiles.html" class="list-group-item d-flex align-items-center py-3">
                                <i class="bx bx-user fs-4 me-2 icono-perfil"></i>
                                Ver perfiles
                            </a>
                            <a href="docente-registro-asistencia.html" class="list-group-item d-flex align-items-center py-3">
                                <i class="bx bx-clipboard-check fs-4 me-2 icono-asistencia"></i>
                                Registro de asistencia
                            </a>
                            <a href="docente-registro-notas.html" class="list-group-item d-flex align-items-center py-3">
                                <i class="bx bx-education fs-4 me-2 icono-notas"></i>
                                Registro de notas
                            </a>
                            <a href="docente-documentos-personales.html" class="list-group-item d-flex align-items-center py-3">
                                <i class="bx bx-clipboard-detail fs-4 me-2 icono-gestion-academica"></i>
                                Documentos
                            </a>
                        </nav>
                    </aside>
                    <section class="col-md-10 py-4 px-4">
                        <h1 class="mb-4">Mi perfil</h1>
                        
                        <div class="caja-valor p-4">
                            <form>
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="nombres" class="form-label fw-bold small">Nombres *</label>
                                        <input id="nombres" type="text" class="form-control form-control-sm campo-formulario" value="Khan Zhaito">
                                    </div>
                                    <div class="col-md-6 mt-3 mt-md-0">
                                        <label for="apellidos" class="form-label fw-bold small">Apellidos *</label>
                                        <input id="apellidos" type="text" class="form-control form-control-sm campo-formulario" value="Silva Perez">
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="rut" class="form-label fw-bold small">Rut *</label>
                                        <input id="rut" type="text" class="form-control form-control-sm campo-formulario" placeholder="12.345.678-9" value="98.765.432-1">
                                    </div>
                                    <div class="col-md-6 mt-3 mt-md-0">
                                        <label for="nivel" class="form-label fw-bold small">Nivel de enseñanza *</label>
                                        <select id="nivel" class="form-select form-select-sm campo-formulario">
                                            <option>Educación Básica</option>
                                            <option>Educación Media</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="row mb-4">
                                    <div class="col-md-6">
                                        <label for="telefono" class="form-label fw-bold small">Teléfono *</label>
                                        <input id="telefono" type="text" class="form-control form-control-sm campo-formulario" value="912345678">
                                    </div>
                                    <div class="col-md-6 mt-3 mt-md-0">
                                        <label for="correo" class="form-label fw-bold small">Correo Electrónico *</label>
                                        <input id="correo" type="email" class="form-control form-control-sm campo-formulario" value="khan.zhaito@profesor.cl">
                                    </div>
                                </div>
                                <div class="text-end">
                                    <button id="btn-modificar" type="submit" class="btn btn-sm boton-calcular px-4">Modificar</button>
                                </div>
                            </form>
                        </div>
                    </section>
                </div>
            </div>
        </main>
        <footer>
            <div class="container-fluid py-5">
                <div class="row">
                    <div class="col-md-6 px-5 mb-4 mb-md-0">
                        <img src="images/logo-deep-white.png" class="logo mb-3" alt="Logo Colegio">
                        <p>Formando líderes desde 2026. Educación de calidad y excelencia académica</p>
                        <hr>
                        <div class="d-flex mt-3">
                            <a href="#" class="me-3">
                                <img class="logos-enlaces" src="images/Instagram_Glyph_White.png" alt="Logotipo Instagram">
                            </a>
                            <a href="#" class="me-3">
                                <img class="logos-enlaces" src="images/Facebook_Logo_Secondary.png" alt="Logotipo Facebook">
                            </a>
                            <a href="#" class="me-3">
                                <img class="logos-enlaces" src="images/logo-white.png" alt="Logotipo X">
                            </a>
                            <a href="#" class="me-3">
                                <img class="logos-enlaces" src="images/InBug-White.png" alt="Logotipo LinkedIn">
                            </a>
                        </div>
                    </div>
                    <div class="col-md-6 px-5">
                        <ul class="list-unstyled">
                            <li class="mb-4">
                                <span class="fs-5 fw-bold">Contacto</span>
                            </li>
                            <li class="mb-2 d-flex align-items-center">
                                <i class="bx bx-location fs-5 me-2 icono-ubicacion"></i>
                                Av. Ubicación 123
                            </li>
                            <li class="mb-2 d-flex align-items-center">
                                <i class="bx bx-phone fs-5 me-2 icono-telefono"></i>
                                +56 9 9876 5432
                            </li>
                            <li class="d-flex align-items-center">
                                <i class="bx bx-envelope fs-5 me-2 icono-correo"></i>
                                correo.ejemplo@colegio.cl
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </footer>
        <script src="scripts/docente-mi-perfil.js"></script>
    </body>
</html>
