<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <title>Página Principal</title>
        <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <div>
                <a href="#">Mi colegio</a>
                <span>Directiva</span>
                <button id="btn-cerrar">
                    Cerrar sesión
                </button>
            </div>
        </header>
        <main>
            <section class="resumen-general">
                <h1>Resumen General</h1>
                <div>
                    <div>
                        <i class="bx bx-people-diversity"></i>
                        <div>
                            <span>Numero de estudiantes</span>
                            <span>300</span>
                        </div>
                    </div>
                    <div>
                        <i class="bx bx-group"></i>
                        <div>
                            <span>Número de docentes</span>
                            <span>30</span>
                        </div>
                    </div>
                    <div>
                        <i class="bx bx-hail"></i>
                        <div>
                            <span>Número de auxiliares</span>
                            <span>20</span>
                        </div>
                    </div>
                    <div>
                        <i class="bx bx-school"></i>
                        <div>
                            <span>Cursos</span>
                            <span>12</span>
                        </div>
                    </div>
                </div>
                <button>Nuevo registro</button>
            </section>
            <section class="formulario">
                <form>
                    <span>Seleccione una opción:</span>
                    <div>
                        <input id="docente" type="radio">
                        <label for="docente">Docente</label>
                        <input id="estudiante" type="radio">
                        <label for="estudiante">Estudiante</label>
                        <input id="auxiliar" type="radio">
                        <label for="auxiliar">Auxiliar</label>
                    </div>
                </form>
                <div>
                    <div>
                        <i class="bx bx-form"></i>
                        <h2 id="titulo">Gestión de </h2>
                    </div>
                    <form>
                        <div>
                            <label for="nombre-alumno">Nombre del alumno *</label>
                            <input id="nombre-alumno" type="text">
                            <label for="rut-alumno">Rut del alumno *</label>
                            <input id="rut-alumno" type="text" placeholder="12.345.678-9">
                        </div>
                        <div>
                            <div>
                                <label for="curso">Curso *</label>
                                <select id="curso">
                                    <option>1° Básico</option>
                                    <option>2° Básico</option>
                                    <option>3° Básico</option>
                                    <option>4° Básico</option>
                                    <option>5° Básico</option>
                                    <option>6° Básico</option>
                                    <option>7° Básico</option>
                                    <option>8° Básico</option>
                                    <option>1° Medio</option>
                                    <option>2° Medio</option>
                                    <option>3° Medio</option>
                                    <option>4° Medio</option>                                    
                                </select>
                            </div>
                            <div>
                                <label for="estado-alumno">Estado</label>
                                <select id="estado-alumno">
                                    <option>Activo</option>
                                    <option>Condicional</option>
                                    <option>Retirado</option>
                                </select>
                            </div>
                            <div>
                                <label for="apoderado">Apoderado titular *</label>
                                <input id="apoderado" type="text">
                                <label for="telefono-apoderado">Teléfono Apoderado *</label>
                                <input id="telefono-apoderado" type="text">
                            </div>
                            <label for="observaciones">Observaciones</label>
                            <textarea id="observaciones">
                        </div>
                    </form>
                </div>
            </section>
        </main>
        <footer>
            <div>
                <span>Mi colegio</span>
                <p>Formando líderes desde 2026. Educación de calidad y excelencia académica</p>
            </div>
            <div>
                <ul>
                    <li>
                        <span>Contacto</span>
                    </li>
                    <li>
                        <i class="bx bx-location"></i>
                        Av. Ubicación 123
                    </li>
                    <li>
                        <i class="bx bx-phone"></i>
                        +56 9 9876 5432
                    </li>
                    <li>
                        <i class="bx bx-envelope"></i>
                        correo.ejemplo@colegio.cl
                    </li>
                </ul>
            </div>
        </footer>
    </body>
</html>
